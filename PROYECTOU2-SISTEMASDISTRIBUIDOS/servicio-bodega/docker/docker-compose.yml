services:

  postgres-primary:
    image: postgres:15-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hanter12
      POSTGRES_DB: bodega_hospital
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:15-alpine
    container_name: postgres-replica
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Hanter12
      POSTGRES_DB: bodega_hospital
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy

  servicio-bodega:
    build: .
    container_name: servicio-bodega-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-primary:5432/bodega_hospital
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Hanter12
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_primary_data:
  postgres_replica_data:
