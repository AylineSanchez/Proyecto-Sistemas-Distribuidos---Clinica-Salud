<!DOCTYPE html>
<!-- 
    ============================================
    PANTALLA DE GENERACIÓN DE TICKET
    Clínica Salud - Sistema de Atención
    ============================================
    Esta pantalla permite a los pacientes:
    1. Seleccionar el tipo de atención médica
    2. Elegir a qué médico/laboratorio/ventanilla desea ser asignado
    3. Ingresar sus datos personales
    4. Generar un ticket de atención
    
    El ticket generado aparece en la pantalla y se guarda en la base de datos.
    El paciente debe esperar a ser llamado en la pantalla de sala de espera.
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Salud - Generar Ticket</title>
    <!-- Fuente Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Estilos CSS externos -->
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div class="container">
        <!-- ENCABEZADO -->
        <div class="header">
            <div class="logo">
                <span class="logo-icon">🏥</span>
                <h1>Clínica Salud</h1>
            </div>
            <p class="subtitle">Sistema de Atención - Genera tu ticket</p>
        </div>

        <!-- FORMULARIO DE GENERACIÓN DE TICKET -->
        <div class="card">
            <div class="card-header">
                <span class="card-icon">🎫</span>
                <h2>Generar Ticket de Atención</h2>
            </div>
            
            <form id="ticketForm" class="ticket-form">
                <!-- Selector de tipo de atención -->
                <div class="form-group">
                    <label>Tipo de Atención</label>
                    <select id="tipoAtencion" required>
                        <option value="Consulta Médica">Consulta Médica</option>
                        <option value="Toma de Muestras">Toma de Muestras</option>
                        <option value="Retiro de Resultados">Retiro de Resultados</option>
                    </select>
                </div>
                
                <!-- Selector de módulo destino (dinámico según el tipo) -->
                <div class="form-group">
                    <label>👨‍⚕️ Asignar a:</label>
                    <select id="moduloDestino" required>
                        <!-- Los valores se llenan dinámicamente con JavaScript -->
                    </select>
                    <div class="modulo-info" id="moduloInfo"></div>
                </div>
                
                <!-- Datos del paciente -->
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombrePaciente" placeholder="Ingresa tu nombre completo" required>
                </div>
                
                <div class="form-group">
                    <label>RUT (opcional)</label>
                    <input type="text" id="rut" placeholder="Ej: 12.345.678-9">
                </div>
                
                <button type="submit" class="btn btn-primary">🎫 Generar Ticket</button>
            </form>
        </div>

        <!-- TARJETA QUE MUESTRA EL TICKET GENERADO (aparece temporalmente) -->
        <div id="ticketGenerado" class="ticket-card" style="display: none;">
            <div class="ticket-header">🎫 Tu Ticket</div>
            <div class="ticket-number" id="ticketNumero"></div>
            <div class="ticket-info" id="ticketInfo"></div>
            <div class="ticket-message">Espera a ser llamado en las pantallas</div>
        </div>

        <!-- CONTADOR DE PERSONAS EN ESPERA -->
        <div class="info-box">
            <span>ℹ️</span>
            <span>En espera actual: <strong id="esperaActual">0</strong> personas</span>
        </div>
    </div>

    <!-- LOGICA DE NEGOCIO -->
    <script>
        // ============================================
        // CONFIGURACIÓN DE MÓDULOS POR TIPO DE ATENCIÓN
        // ============================================
        // Define qué módulos están disponibles para cada tipo de atención
        // Esto asegura que los pacientes sean asignados correctamente
        const modulosPorTipo = {
            'Consulta Médica': [
                { value: 'Médico 1', label: '👨‍⚕️ Médico 1 - Consulta 1' },
                { value: 'Médico 2', label: '👨‍⚕️ Médico 2 - Consulta 2' },
                { value: 'Médico 3', label: '👨‍⚕️ Médico 3 - Consulta 3' }
            ],
            'Toma de Muestras': [
                { value: 'Laboratorio A', label: '🔬 Laboratorio A - Toma de Muestras' },
                { value: 'Laboratorio B', label: '🔬 Laboratorio B - Toma de Muestras' }
            ],
            'Retiro de Resultados': [
                { value: 'Ventanilla 1', label: '📋 Ventanilla 1 - Retiro de Resultados' },
                { value: 'Ventanilla 2', label: '📋 Ventanilla 2 - Retiro de Resultados' }
            ]
        };
        
        // ============================================
        // ACTUALIZAR SELECTOR DE MÓDULO
        // ============================================
        // Cuando el usuario cambia el tipo de atención, se actualizan
        // las opciones del selector de módulo para mostrar solo los válidos
        function actualizarSelectorModulo() {
            const tipo = document.getElementById('tipoAtencion').value;
            const select = document.getElementById('moduloDestino');
            const infoDiv = document.getElementById('moduloInfo');
            
            // Limpiar select
            select.innerHTML = '';
            
            // Obtener módulos para este tipo
            const modulos = modulosPorTipo[tipo];
            
            if (modulos && modulos.length > 0) {
                modulos.forEach(modulo => {
                    const option = document.createElement('option');
                    option.value = modulo.value;
                    option.textContent = modulo.label;
                    select.appendChild(option);
                });
            } else {
                infoDiv.innerHTML = `⚠️ No hay módulos disponibles para ${tipo}`;
                infoDiv.style.color = '#e53e3e';
            }
        }
        
        // ============================================
        // ACTUALIZAR CONTADOR DE ESPERA
        // ============================================
        // Consulta al backend cuántas personas están actualmente en espera
        async function actualizarContadorEspera() {
            try {
                const response = await fetch('/api/en-espera');
                const data = await response.json();
                document.getElementById('esperaActual').innerText = data.cantidad;
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        // ============================================
        // ESCUCHAR CAMBIOS EN EL TIPO DE ATENCIÓN
        // ============================================
        document.getElementById('tipoAtencion').addEventListener('change', actualizarSelectorModulo);
        
        // ============================================
        // ENVÍO DEL FORMULARIO - CREAR TICKET
        // ============================================
        // Al enviar el formulario, se envía una petición POST al backend
        // para crear un nuevo ticket con los datos ingresados
        document.getElementById('ticketForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evitar recarga de página
            
            const tipoAtencion = document.getElementById('tipoAtencion').value;
            const moduloDestino = document.getElementById('moduloDestino').value;
            const nombrePaciente = document.getElementById('nombrePaciente').value;
            const rut = document.getElementById('rut').value || null;
            
            // Validación adicional de seguridad
            const modulosValidos = modulosPorTipo[tipoAtencion].map(m => m.value);
            if (!modulosValidos.includes(moduloDestino)) {
                alert('Selección inválida: El módulo no corresponde al tipo de atención');
                return;
            }
            
            const ticket = {
                tipoAtencion: tipoAtencion,
                nombrePaciente: nombrePaciente,
                rut: rut,
                moduloDestino: moduloDestino
            };
            
            try {
                const response = await fetch('/api/tickets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ticket)
                });
                
                if (!response.ok) throw new Error('Error en el servidor');
                
                const nuevoTicket = await response.json();
                
                // Mostrar tarjeta con el ticket generado
                document.getElementById('ticketNumero').innerText = nuevoTicket.numeroTicket;
                document.getElementById('ticketInfo').innerHTML = `
                    <strong>${nuevoTicket.tipoAtencion}</strong><br>
                    ${nuevoTicket.nombrePaciente}<br>
                    <small>Asignado a: ${nuevoTicket.moduloDestino}</small>
                `;
                document.getElementById('ticketGenerado').style.display = 'block';
                document.getElementById('ticketForm').reset(); // Limpiar formulario
                
                // Restaurar selector después de reset
                actualizarSelectorModulo();
                actualizarContadorEspera();
                
                // Ocultar tarjeta después de 8 segundos
                setTimeout(() => {
                    document.getElementById('ticketGenerado').style.display = 'none';
                }, 8000);
            } catch (error) {
                console.error('Error:', error);
                alert('Error al crear ticket');
            }
        });
        
        // ============================================
        // INICIALIZACIÓN
        // ============================================
        actualizarSelectorModulo();  // Configurar selector inicial
        actualizarContadorEspera();  // Obtener contador inicial
        setInterval(actualizarContadorEspera, 5000); // Actualizar contador cada 5 segundos
    </script>
</body>
</html>
